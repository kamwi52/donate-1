<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZRC Donation Portal | Secure Payment</title>
    <style>
        /* --- Base Layout & Reset --- */
        :root {
            --zrc-red: #e21a22;
            --zrc-red-dark: #b3151b;
            --zrc-gray-light: #f8f9fa;
            --zrc-gray-border: #eef0f2;
            --text-dark: #212529;
            --text-muted: #6c757d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* --- Main Container --- */
        .zrc-grid {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }

        .zrc-main-card {
            background: #ffffff;
            border: 1px solid var(--zrc-gray-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
            min-height: 600px;
        }

        /* --- Header Section --- */
        .zrc-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--zrc-gray-border);
            padding-bottom: 20px;
        }

        .zrc-logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 15px;
        }

        .zrc-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0;
        }

        /* --- Amount Selection --- */
        .amount-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .amount-pill {
            background: var(--zrc-gray-light);
            border: 2px solid var(--zrc-gray-border);
            padding: 12px;
            text-align: center;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .amount-pill:hover {
            border-color: #ccc;
        }

        .amount-pill.active {
            background: linear-gradient(135deg, var(--zrc-red) 0%, #ff3b42 100%);
            color: white;
            border-color: var(--zrc-red);
            box-shadow: 0 4px 12px rgba(226, 26, 34, 0.3);
        }

        .custom-amount-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .custom-amount-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            border: 2px solid var(--zrc-gray-border);
            border-radius: 10px;
            box-sizing: border-box;
            padding-right: 110px;
            transition: border 0.3s;
        }

        .custom-amount-input:focus {
            border-color: var(--zrc-red);
            outline: none;
        }

        .currency-select {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: var(--zrc-gray-light);
            font-weight: 700;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* --- Form Groups --- */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-text-input, .form-select-input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--zrc-gray-border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border 0.3s;
        }

        .form-text-input:focus, .form-select-input:focus {
            border-color: var(--zrc-red);
            outline: none;
        }

        /* --- Payment Method --- */
        .payment-method-selector {
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }

        .method-option {
            flex: 1;
            position: relative;
        }

        .method-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .method-label {
            display: block;
            text-align: center;
            padding: 12px;
            border: 2px solid var(--zrc-gray-border);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .method-option input:checked + .method-label {
            border-color: var(--zrc-red);
            color: var(--zrc-red);
            background: rgba(226, 26, 34, 0.05);
        }

        /* --- Extra Options --- */
        .inline-checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .inline-checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .inline-checkbox-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* --- Submit Button --- */
        .submit-donation-btn {
            background: linear-gradient(135deg, var(--zrc-red) 0%, #ff3b42 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(226, 26, 34, 0.25);
            transition: all 0.3s;
        }

        .submit-donation-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(226, 26, 34, 0.35);
        }

        .submit-donation-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* --- State Management --- */
        .state-container {
            display: none;
        }

        .state-container.active {
            display: flex;
            animation: fadeIn 0.4s ease;
        }

        .state-wrapper-box {
            position: absolute;
            inset: 0;
            background: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--zrc-red);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .state-error { color: #dc3545; }
        .retry-btn {
            background: var(--zrc-red);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 700;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 480px) {
            .amount-grid { grid-template-columns: repeat(2, 1fr); }
            .zrc-main-card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="zrc-grid">
    <div class="zrc-main-card">
        
        <!-- Form View -->
        <div id="form-state" class="state-container active">
            <div class="zrc-header">
                <img src="https://redcross.org.zm/sites/default/files/logo.png" alt="ZRC Logo" class="zrc-logo">
                <h1 class="zrc-title">Make a Donation</h1>
            </div>

            <form id="donation-form" onsubmit="handleDonationSubmit(event)">
                <div class="amount-grid">
                    <div class="amount-pill active" data-value="50">50</div>
                    <div class="amount-pill" data-value="100">100</div>
                    <div class="amount-pill" data-value="250">250</div>
                    <div class="amount-pill" data-value="500">500</div>
                    <div class="amount-pill" data-value="1000">1000</div>
                    <div class="amount-pill" data-value="" id="custom-pill">Custom</div>
                </div>

                <div class="custom-amount-wrapper">
                    <input type="number" id="custom-amount" class="custom-amount-input" value="50" min="1" step="any">
                    <select id="currency" class="currency-select">
                        <option value="ZMW">ZMW</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Payment Method</label>
                    <div class="payment-method-selector">
                        <label class="method-option">
                            <input type="radio" name="payment_method" value="mobile_money" checked onchange="handleMethodChange()">
                            <span class="method-label">Mobile Money</span>
                        </label>
                        <label class="method-option">
                            <input type="radio" name="payment_method" value="card" onchange="handleMethodChange()">
                            <span class="method-label">Card</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="donor-name" class="form-text-input" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="donor-email" class="form-text-input" placeholder="email@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" id="phone-label">Mobile Phone Number <span style="color:red">*</span></label>
                    <input type="tel" id="donor-phone" class="form-text-input" placeholder="e.g. 0971234567" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Billing Country</label>
                    <select id="donor-country" class="form-select-input" onchange="toggleCountryRules()">
                        <option value="ZM" selected>Zambia (ZM)</option>
                        <option value="KE">Kenya (KE)</option>
                        <option value="TZ">Tanzania (TZ)</option>
                        <option value="UG">Uganda (UG)</option>
                        <option value="ZA">South Africa (ZA)</option>
                        <option value="US">United States (US)</option>
                        <option value="GB">United Kingdom (GB)</option>
                    </select>
                </div>

                <div class="inline-checkbox-group">
                    <input type="checkbox" id="is-anonymous" onchange="toggleAnonymous()">
                    <label for="is-anonymous">Donate anonymously</label>
                </div>

                <div class="form-group">
                    <label class="form-label">Message (Optional)</label>
                    <textarea id="message-text" class="form-text-input" style="min-height:60px;resize:none;" placeholder="Leave a note..."></textarea>
                </div>

                <button type="submit" class="submit-donation-btn" id="pay-button">Proceed with ZMW 50.00</button>
            </form>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="state-container">
            <div class="state-wrapper-box">
                <div class="spinner"></div>
                <p>Securing your payment portal...</p>
            </div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="state-container">
            <div class="state-wrapper-box state-error">
                <div style="font-size:3rem; margin-bottom:15px;">⚠️</div>
                <h3>Payment Failed</h3>
                <p id="error-description"></p>
                <button class="retry-btn" onclick="resetForm()">Try Again</button>
            </div>
        </div>

    </div>
</div>

<script>
    const API_ENDPOINT = 'https://zrc-payment-backend.vercel.app/api/checkout';
    let isProcessing = false;

    function updateSummaryDisplay() {
        const amt = parseFloat(document.getElementById('custom-amount').value) || 0;
        const curr = document.getElementById('currency').value;
        document.getElementById('pay-button').innerText = `Proceed with ${curr} ${amt.toFixed(2)}`;
    }

    function selectAmount(val, element) {
        document.querySelectorAll('.amount-pill').forEach(p => p.classList.remove('active'));
        element.classList.add('active');
        const input = document.getElementById('custom-amount');
        input.value = val === "" ? '' : val;
        if(val === "") input.focus();
        updateSummaryDisplay();
    }

    function handleMethodChange() {
        const method = document.querySelector('input[name="payment_method"]:checked').value;
        const label = document.getElementById('phone-label');
        const input = document.getElementById('donor-phone');
        
        // IMPORTANT: Phone is now REQUIRED for all users due to API rules
        label.innerHTML = 'Mobile Phone Number <span style="color:red">*</span>';
        input.required = true; 
        
        if (method === 'card') {
            input.placeholder = "e.g. 0971234567 (Required for confirmation)";
        } else {
            input.placeholder = "e.g. 0971234567";
        }
    }

    function toggleCountryRules() {
        const country = document.getElementById('donor-country').value;
        const label = document.getElementById('phone-label');
        const input = document.getElementById('donor-phone');
        if (country === 'ZM') {
            label.innerHTML = 'Mobile Phone Number <span style="color:red">*</span>';
            input.placeholder = "e.g. 0971234567";
        } else {
            label.innerHTML = 'Mobile Phone Number (Include Country Code) <span style="color:red">*</span>';
            input.placeholder = "e.g. 254712345678";
        }
    }

    function toggleAnonymous() {
        const isAnon = document.getElementById('is-anonymous').checked;
        const nameInput = document.getElementById('donor-name');
        nameInput.value = isAnon ? 'Anonymous' : '';
        nameInput.disabled = isAnon;
        if (!isAnon) nameInput.focus();
    }

    function switchState(state) {
        document.querySelectorAll('.state-container').forEach(el => el.classList.remove('active'));
        document.getElementById(state + '-state').classList.add('active');
    }

    function resetForm() {
        switchState('form');
        isProcessing = false;
    }

    async function handleDonationSubmit(event) {
        event.preventDefault();
        if (isProcessing) return;
        isProcessing = true;

        switchState('loading');

        const payload = {
            donorName: document.getElementById('is-anonymous').checked ? 'Anonymous' : document.getElementById('donor-name').value,
            donationAmount: document.getElementById('custom-amount').value,
            donationCurrency: document.getElementById('currency').value,
            donorEmail: document.getElementById('donor-email').value,
            donorCountry: document.getElementById('donor-country').value,
            donorPhone: document.getElementById('donor-phone').value,
            paymentMethod: document.querySelector('input[name="payment_method"]:checked').value,
            messageText: document.getElementById('message-text').value
        };

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (!response.ok) {
                // Display the actual description from the server if available
                throw new Error(result.description || result.error || `Error ${response.status}`);
            }

            if (result.status === 'success' && result.redirect_url) {
                window.location.href = result.redirect_url;
            } else {
                throw new Error('Payment gateway configuration error.');
            }
        } catch (err) {
            console.error('Payment Error:', err);
            document.getElementById('error-description').innerText = err.message;
            switchState('error');
            isProcessing = false;
        }
    }

    // Event Listeners
    document.querySelectorAll('.amount-pill').forEach(pill => {
        pill.addEventListener('click', () => selectAmount(pill.dataset.value, pill));
    });
    document.getElementById('custom-amount').addEventListener('input', () => {
        document.querySelectorAll('.amount-pill').forEach(p => p.classList.remove('active'));
        document.getElementById('custom-pill').classList.add('active');
        updateSummaryDisplay();
    });
    document.getElementById('currency').addEventListener('change', updateSummaryDisplay);
    document.addEventListener('DOMContentLoaded', updateSummaryDisplay);
</script>

</body>
</html>
