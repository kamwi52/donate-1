<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZRC Donation Form</title>
    <style>
        /* Reset & Base Layout */
        main, .layout-content, .region-content, .block-system-main-block, article, .node, .node__content, .field--name-body, .content, .clearfix { 
            display: block !important; width: 100% !important; max-width: 1140px !important; margin: 0 auto !important; padding: 0 24px !important; box-sizing: border-box !important; 
        }
        .template--with-sidebar__content { display: block !important; width: 100% !important; max-width: 1140px !important; margin: 0 auto !important; padding: 0 24px !important; box-sizing: border-box !important; }
        .template--with-sidebar__content__sidebar { display: none !important; }
        .template--with-sidebar__content__main { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; box-sizing: border-box !important; }
        
        /* Grid & Card */
        .zrc-grid { display: block !important; margin: 15px auto !important; width: 100% !important; max-width: 100% !important; padding: 0 10px !important; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
        @media (min-width: 768px) { .zrc-grid { margin: 40px auto !important; max-width: 700px !important; padding: 0 20px !important; } }
        
        .zrc-main-card { background: #ffffff; border: 1px solid #eef0f2; border-radius: 12px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); box-sizing: border-box; width: 100%; min-height: 550px; position: relative; }
        @media (min-width: 768px) { .zrc-main-card { padding: 35px; } }
        
        /* Header */
        .zrc-header { display: flex; flex-direction: column; align-items: center; gap: 15px; border-bottom: 1px solid #e9ecef; padding-bottom: 20px; margin-bottom: 25px; }
        @media (min-width: 768px) { .zrc-header { flex-direction: row; justify-content: space-between; } }
        
        .zrc-back-btn { background: #f1f3f5; color: #495057; border: none; width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-weight: bold; cursor: pointer; transition: background 0.15s; }
        .zrc-logo { height: auto; max-width: 110px; object-fit: contain; }
        @media (min-width: 768px) { .zrc-logo { max-width: 140px; } }
        
        .zrc-amount-box { text-align: center; }
        @media (min-width: 768px) { .zrc-amount-box { text-align: right; } }
        .zrc-amount-label { display: block; font-size: 0.7rem; font-weight: bold; color: #868e96; letter-spacing: 1px; }
        .zrc-amount-val { font-size: 1.3rem; font-weight: 800; color: #1a1a1a; }
        .zrc-currency-tag { font-size: 0.8rem; font-weight: bold; color: #6c757d; background: #f1f3f5; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
        
        /* Inputs & Grid */
        .amount-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .amount-pill { background: #f8f9fa; border: 2px solid #f1f3f5; padding: 10px; font-size: 0.9rem; text-align: center; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; color: #495057; user-select: none; }
        .amount-pill.active { background: linear-gradient(135deg, #e21a22 0%, #ff3b42 100%); color: white; border-color: #e21a22; box-shadow: 0 4px 10px rgba(226, 26, 34, 0.2); }
        
        .custom-amount-wrapper { position: relative; margin-bottom: 15px; }
        .custom-amount-input { width: 100%; padding: 12px; font-size: 1.15rem; font-weight: bold; border: 2px solid #e9ecef; border-radius: 8px; box-sizing: border-box; padding-right: 110px; color: #212529; }
        .currency-select { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: #f1f3f5; font-weight: bold; padding: 10px 12px; border-radius: 6px; cursor: pointer; }
        
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-label { display: block; font-size: 0.9rem; font-weight: bold; color: #495057; margin-bottom: 6px; }
        .form-text-input, .form-select-input { width: 100%; padding: 10px 12px; border: 2px solid #e9ecef; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; color: #333; transition: border 0.3s; background: #fff; }
        .form-text-input:focus, .form-select-input:focus { border-color: #e21a22; outline: none; }

        .payment-method-selector { display: flex; gap: 15px; margin-top: 5px; }
        .method-option { flex: 1; position: relative; }
        .method-option input { position: absolute; opacity: 0; cursor: pointer; }
        .method-label { display: block; text-align: center; padding: 10px; border: 2px solid #e9ecef; border-radius: 8px; font-weight: bold; color: #495057; cursor: pointer; transition: all 0.2s; }
        .method-option input:checked + .method-label { background: #f8f9fa; border-color: #e21a22; color: #e21a22; }

        .inline-checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
        .inline-checkbox-group input { width: 18px; height: 18px; cursor: pointer; }
        .inline-checkbox-group label { font-size: 0.9rem; font-weight: bold; color: #495057; cursor: pointer; }
        
        .submit-donation-btn { background: linear-gradient(135deg, #e21a22 0%, #ff3b42 100%); color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(226, 26, 34, 0.3); transition: all 0.3s; }
        .submit-donation-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(226, 26, 34, 0.45); }
        .submit-donation-btn:disabled { background: #ccc !important; cursor: not-allowed; }
        
        .state-container { display: none; }
        .state-container.active { display: flex; animation: fadeIn 0.4s ease; }
        
        .state-wrapper-box { position: absolute; inset: 0; background: white; padding: 35px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 10; border-radius: 12px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #e21a22; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        .state-error { color: #dc3545; }
        .retry-btn { background: #e21a22; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="zrc-grid">
    <div class="zrc-main-card">
        
        <!-- Form View Component -->
       

            <form id="donation-form" onsubmit="handleDonationSubmit(event)">
                <div class="amount-grid">
                    <div class="amount-pill active" data-value="50">50</div>
                    <div class="amount-pill" data-value="100">100</div>
                    <div class="amount-pill" data-value="250">250</div>
                    <div class="amount-pill" data-value="500">500</div>
                    <div class="amount-pill" data-value="1000">1000</div>
                    <div class="amount-pill" data-value="" id="custom-pill">Custom</div>
                </div>

                <div class="custom-amount-wrapper">
                    <input type="number" id="custom-amount" class="custom-amount-input" value="50" min="1" step="any">
                    <select id="currency" class="currency-select">
                        <option value="ZMW">ZMW</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Payment Method</label>
                    <div class="payment-method-selector">
                        <label class="method-option">
                            <input type="radio" name="payment_method" value="mobile_money" checked onchange="handleMethodChange()">
                            <span class="method-label">Mobile Money</span>
                        </label>
                        <label class="method-option">
                            <input type="radio" name="payment_method" value="card" onchange="handleMethodChange()">
                            <span class="method-label">Card</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="donor-name" class="form-text-input" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="donor-email" class="form-text-input" placeholder="johndoe@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" id="phone-label">Mobile Phone Number <span style="color:red">*</span></label>
                    <input type="tel" id="donor-phone" class="form-text-input" placeholder="e.g. 0971234567" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Billing Country</label>
                    <select id="donor-country" class="form-select-input" onchange="toggleCountryRules()">
                        <option value="ZM" selected>Zambia (ZM)</option>
                        <option value="KE">Kenya (KE)</option>
                        <option value="TZ">Tanzania (TZ)</option>
                        <option value="UG">Uganda (UG)</option>
                        <option value="ZA">South Africa (ZA)</option>
                        <option value="US">United States (US)</option>
                        <option value="GB">United Kingdom (GB)</option>
                    </select>
                </div>

                <div class="inline-checkbox-group">
                    <input type="checkbox" id="is-anonymous" onchange="toggleAnonymous()">
                    <label for="is-anonymous">Make this donation anonymous</label>
                </div>

                <div class="form-group">
                    <label class="form-label">Message (Optional)</label>
                    <textarea id="message-text" class="form-text-input" style="min-height:60px;resize:none;"></textarea>
                </div>

                <button type="submit" class="submit-donation-btn" id="pay-button">Proceed with ZMW 50.00</button>
            </form>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="state-container">
            <div class="state-wrapper-box">
                <div class="spinner"></div>
                <p>Preparing secure payment portal...</p>
            </div>
        </div>

        <!-- Error State -->
        <div id="error-state" class="state-container">
            <div class="state-wrapper-box state-error">
                <div style="font-size:3rem;">⚠️</div>
                <h3>Payment Failed</h3>
                <p id="error-description"></p>
                <button class="retry-btn" onclick="resetForm()">Try Again</button>
            </div>
        </div>

    </div>
</div>

<script>
    const API_ENDPOINT = 'https://zrc-payment-backend.vercel.app/api/checkout';
    let isProcessing = false;

    // UI Updates
    function updateSummaryDisplay() {
        const amt = parseFloat(document.getElementById('custom-amount').value) || 0;
        const curr = document.getElementById('currency').value;
        document.getElementById('summary-val').innerText = amt.toFixed(2);
        document.getElementById('summary-currency').innerText = curr;
        document.getElementById('pay-button').innerText = `Proceed with ${curr} ${amt.toFixed(2)}`;
    }

    function selectAmount(val, element) {
        document.querySelectorAll('.amount-pill').forEach(p => p.classList.remove('active'));
        element.classList.add('active');
        const input = document.getElementById('custom-amount');
        if(val === "") {
            input.value = '';
            input.focus();
        } else {
            input.value = val;
        }
        updateSummaryDisplay();
    }

    function handleMethodChange() {
        const method = document.querySelector('input[name="payment_method"]:checked').value;
        const label = document.getElementById('phone-label');
        const input = document.getElementById('donor-phone');
        if (method === 'card') {
            label.innerHTML = 'Mobile Phone Number (Optional)';
            input.required = false;
        } else {
            label.innerHTML = 'Mobile Phone Number <span style="color:red">*</span>';
            input.required = true;
        }
    }

    function toggleCountryRules() {
        const country = document.getElementById('donor-country').value;
        const label = document.getElementById('phone-label');
        const input = document.getElementById('donor-phone');
        if (country === 'ZM') {
            label.innerHTML = 'Mobile Phone Number <span style="color:red">*</span>';
            input.placeholder = "e.g. 0971234567";
        } else {
            label.innerHTML = 'Mobile Phone Number (Include Country Code)';
            input.placeholder = "e.g. 254712345678";
        }
    }

    function toggleAnonymous() {
        const isAnon = document.getElementById('is-anonymous').checked;
        const nameInput = document.getElementById('donor-name');
        nameInput.value = isAnon ? 'Anonymous' : '';
        nameInput.disabled = isAnon;
    }

    function switchState(state) {
        document.querySelectorAll('.state-container').forEach(el => el.classList.remove('active'));
        document.getElementById(state + '-state').classList.add('active');
    }

    function resetForm() {
        switchState('form');
        isProcessing = false;
    }

    // CORE SUBMISSION LOGIC
    async function handleDonationSubmit(event) {
        event.preventDefault();
        if (isProcessing) return;
        isProcessing = true;

        switchState('loading');

        const payload = {
            donorName: document.getElementById('is-anonymous').checked ? 'Anonymous' : document.getElementById('donor-name').value,
            donationAmount: document.getElementById('custom-amount').value,
            donationCurrency: document.getElementById('currency').value,
            donorEmail: document.getElementById('donor-email').value,
            donorCountry: document.getElementById('donor-country').value,
            donorPhone: document.getElementById('donor-phone').value,
            paymentMethod: document.querySelector('input[name="payment_method"]:checked').value,
            messageText: document.getElementById('message-text').value
        };

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.status === 500) {
                throw new Error('Payment gateway is currently unavailable. Please try again later.');
            }

            if (!response.ok) {
                throw new Error(`Payment processing failed (Status: ${response.status}). Please try again.`);
            }

            const result = await response.json();

            if (!result.status || result.status !== 'success') {
                throw new Error(result.error || 'Payment could not be processed. Please check your details and try again.');
            }

            if (!result.redirect_url) {
                throw new Error('Payment gateway configuration error. Please contact support.');
            }

            window.location.href = result.redirect_url;
        } catch (err) {
            console.error('Donation submission error:', err);
            document.getElementById('error-description').innerText = err.message || 'Payment processing failed. Please try again.';
            switchState('error');
            isProcessing = false;

            // Log the error to a monitoring service if available
            if (typeof logError === 'function') {
                logError(err);
            }
        }
    }

    // Listeners
    document.getElementById('custom-amount').addEventListener('input', () => {
        document.querySelectorAll('.amount-pill').forEach(p => p.classList.remove('active'));
        document.getElementById('custom-pill').classList.add('active');
        updateSummaryDisplay();
    });
    document.getElementById('currency').addEventListener('change', updateSummaryDisplay);
    document.addEventListener('DOMContentLoaded', updateSummaryDisplay);
</script>

</body>
</html>
